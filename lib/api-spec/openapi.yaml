openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leaderboard
    description: Leaderboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get leaderboard
      description: Returns top players ordered by XP
      responses:
        "200":
          description: List of top players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/sync:
    post:
      operationId: syncPlayer
      tags: [leaderboard]
      summary: Sync player stats
      description: Upserts the current user's stats into the leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "200":
          description: Synced player entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LeaderboardEntry:
      type: object
      required: [id, name, xp, level, streak, totalQuizzes, rank]
      properties:
        id:
          type: integer
        name:
          type: string
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        totalQuizzes:
          type: integer
        rank:
          type: integer

    PlayerInput:
      type: object
      required: [name, xp, level, streak, totalQuizzes]
      properties:
        name:
          type: string
        xp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        totalQuizzes:
          type: integer
